name: 로또 데이터 업데이트

on:
  schedule:
    - cron: '30 13 * * 6'
  workflow_dispatch:

jobs:
  update-lotto-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests cloudscraper

      - name: 로또 데이터 수집
        run: python scripts/fetch_lotto.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          git add data/lotto.json
          git diff --staged --quiet || \
            git commit -m "🎱 로또 데이터 업데이트 $(date '+%Y-%m-%d')" && \
            git push
